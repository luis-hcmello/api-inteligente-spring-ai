services:
  postgres:
    image: postgres:17-alpine
    container_name: api-inteligente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-orcamento_db}
      POSTGRES_USER: ${DB_USER:-orcamento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orcamento123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orcamento} -d ${DB_NAME:-orcamento_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
